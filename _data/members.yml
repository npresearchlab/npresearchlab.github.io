# Current lab members, shown on the People page in this order.
# Core group order: staff and postdocs by seniority (years since PhD), then PhD students, then affiliated members.
# To add someone: copy one block (from '- name:' down to the end of 'bio'), paste it, and edit it.
# Put their photo in assets/img/people/ (square-ish, about 600px wide) and set 'photo' to its path.
# pronouns (optional): shown small after the name, e.g. pronouns: she/her
# links (optional): label + url, e.g. Google Scholar, Website, or Email (url: mailto:name@emory.edu).
# bio: for paragraph breaks, write 'bio: |-' and leave a blank line between paragraphs.
# mentor (optional, mainly for undergraduates): the mentor's name exactly as listed here, e.g. mentor: "Yasmine Bassil, PhD"
# joint (optional): one line about another lab. Shared members: "Joint with Dr. Lena Ting's Neuromechanics Lab". Affiliated members: "Based in Dr. Lena Ting's Neuromechanics Lab".
# group must be one of: "Research staff, postdocs, and graduate students" or "Undergraduate students"
# To move someone to alumni: delete their block here and add a line to alumni.yml.

- name: Nathan A. Baune, PhD
  pronouns: he/him
  role: Lead Research Biomedical Engineer
  group: Research staff, postdocs, and graduate students
  affiliation: Department of Rehabilitation Medicine, Emory University
  joint: Joint with Dr. Lena Ting's Neuromechanics Lab
  honors: AHA, APDA Postdoctoral Fellowships
  photo: /assets/img/people/nathan-baune.jpg
  links:
  - label: Email
    url: mailto:nbaune@emory.edu
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=BpYiSmQAAAAJ&hl=en
  - label: Website
    url: https://nathanabaune.com
  bio: |-
    Nathan Baune, PhD, is Lead Research Biomedical Engineer in the Neural Plasticity Research Lab and the Neuromechanics Lab at Emory University. He studies how the brain estimates and controls the state of the body, and builds the instruments and software that make those questions testable in patients. His current work combines EEG, EMG, and robotic perturbations to study movement in Parkinson's disease, including the brain–body dynamics behind freezing. He designed PRE-Sync, a synchronization device now used by labs across institutions, co-invented POISE, a portable balance-perturbation device, and built the open-source tools Epoche and MR.Flow, in use across several Emory labs.

    Nathan came to research through psychology at the University of Oregon. He earned his PhD in Rehabilitation Science at Washington University School of Medicine, using fMRI and virtual reality to study how people control movement when they cannot see their own body, and co-founded a start-up that used smartwatches to track daily activities in stroke survivors. He joined Emory as a postdoctoral fellow in 2021, supported by fellowships from the American Heart Association and the American Parkinson Disease Association.

    Outside the lab, he plays music, cooks, and builds elaborate Halloween costumes.
