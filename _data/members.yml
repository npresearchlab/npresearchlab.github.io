  - label: Google Scholar
    url: https://scholar.google.com/citations?user=ZRW9yhcAAAAJ&hl=en
  bio: >-
    Isaiah Lachica is a Postdoctoral Fellow at Emory University working with Dr. Lena Ting and
    Dr. Michael Borich. His research integrates principles from motor control, biomechanics, and
    neuroscience to determine how dysfunction across multiple levels of the motor system contributes
    to mobility impairment in movement disorders.
- name: Oindrila Sinha, PhD
  pronouns: she/her
  role: Postdoctoral Fellow
  group: Research staff, postdocs, and graduate students
  affiliation: School of Biological Sciences, Georgia Institute of Technology
  joint: Joint with Dr. Lewis Wheaton's Cognitive Motor Control Lab
  honors: McCallum Early Career Fellowship
  photo: /assets/img/people/oindrila-sinha.jpg
  links:
  - label: Email
    url: mailto:osinha8@gatech.edu
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=RunZZMYAAAAJ&hl=en
  - label: Website
    url: https://oindrila-sinha.github.io/
  bio: |-
    Oindrila Sinha, PhD, is a postdoctoral fellow at the Georgia Institute of Technology and Emory School of Medicine. She studies how perceptual learning becomes motor skill, how this changes across adulthood, and why people respond differently to the same practice. Her current projects combine eye tracking, EEG, motor-behavior measures, and machine learning. One shows that anticipatory gaze reveals who is learning a movement sequence before their performance improves. Another uses embedded sensors to measure how people use upper-limb prostheses in daily life. A third asks how aging changes the way vision prepares the body for balance.

    Oindrila's path to research began in the life sciences at Presidency University, India. There, she built biomedical devices, including a patented EEG-based drowsy-driver detector and a navigation aid for people with visual impairments. That work led her to a PhD in Motor Control at Penn State, with a minor in Statistics.

    Outside the lab, she loves working out, spending time in nature, and cooking for friends and family.
- name: Yasmine Bassil, PhD
  pronouns: she/her
  role: Assistant Research Scientist
  group: Research staff, postdocs, and graduate students
  affiliation: Department of Rehabilitation Medicine, Emory University
  honors: NIH T32, NSF Graduate Research Fellowship
  photo: /assets/img/people/yasmine-bassil.jpg
  links:
  - label: Email
    url: mailto:ybassil@emory.edu
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=mcp_4HQAAAAJ&hl=en
  - label: Website
    url: https://yasminebassil.com
  bio: |-
    Yasmine Bassil, PhD, is an Assistant Research Scientist in the Neural Plasticity Research Lab, where she studies how the brain helps us find our way, and how that ability changes with age. She uses brain imaging (fMRI) to map the human spatial navigation network and link changes in it to navigation ability later in life, and pairs imaging with brain stimulation (concurrent TMS-fMRI) to map navigational circuits.

    Yasmine earned her PhD in Neuroscience at Emory University, completing her dissertation in this lab as an NSF Graduate Research Fellow and a Scholar in the Georgia Tech/Emory T32 Computational Neural Engineering Training Program. She earned her bachelor's in Neuroscience at Georgia Tech, where she completed the Research Option and used fMRI to study whole-brain dynamics in ADHD in Dr. Shella Keilholz's MIND Lab.

    In graduate school, she co-chaired the Neuroscience Graduate Program's Diversity, Equity, and Inclusion Committee, served as Co-President of Graduates in Neuroscience, and was Internal Affairs Chair of the international non-profit Arabs in Neuroscience.

    Outside the lab, you might find her at local concerts, thrifting, wandering a museum, or singing karaoke. At home, she tends houseplants, cooks cuisines from around the world, and plays music (piano, learning bass guitar).
- name: Iran Gutierrez
  pronouns: she/her
  role: Neuroscience PhD Candidate
  group: Research staff, postdocs, and graduate students
  affiliation: Neuroscience Graduate Program, Emory University
  joint: Joint with Dr. Lena Ting's Neuromechanics Lab
  honors: Centennial Scholar, NIH T32
  photo: /assets/img/people/iran-gutierrez.jpg
  links:
  - label: Email
    url: mailto:imgutie@emory.edu
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=VbXb1UcAAAAJ&hl=en
  bio: |-
    Iran Gutierrez is a Neuroscience PhD student at Emory University co-advised by Drs. Lena Ting (Neuromechanics Lab) and Michael Borich (Neural Plasticity Research Lab). She studies cognitive set-shifting, the brain’s ability to flexibly switch between mental rule sets, and how this ability is impaired in people with Parkinson’s disease. She combines electroencephalography (EEG), electromyography (EMG), inertial measurement units (IMUs), and kinematics to understand set-shifting at the level of the brain, the body, and behavior.

    Iran earned her bachelor’s degree in Psychology from Emory as a QuestBridge Scholar. As a research specialist in the Neural Plasticity Research Lab, she led a project on the premotor cortex’s role in implicit sequence-specific learning, using a serial reaction time task (SRTT), transcranial magnetic stimulation (TMS), and EMG. As a PhD student, she has been named a Centennial Scholar and is supported by Emory’s T32 Neuroscience Training Program.

    Iran has served as Co-President and Secretary of Graduates in Neuroscience and as Communications Committee Chair for the Atlanta Brain Bee Competition.

    Outside the lab, Iran loves spending time with friends, reading fantasy books, exercising, visiting farmers markets, and playing with and cuddling her dachshund Butters, who means the world to her.
