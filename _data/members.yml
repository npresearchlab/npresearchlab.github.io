    ],
    "bio": "Iran Gutierrez is a Neuroscience PhD student at Emory University co-advised by Drs. Lena Ting (Neuromechanics Lab) and Michael Borich (Neural Plasticity Research Lab). She studies cognitive set-shifting, the brain’s ability to flexibly switch between mental rule sets, and how this ability is impaired in people with Parkinson’s disease. She combines electroencephalography (EEG), electromyography (EMG), inertial measurement units (IMUs), and kinematics to understand set-shifting at the level of the brain, the body, and behavior.\n\nIran earned her bachelor’s degree in Psychology from Emory as a QuestBridge Scholar. As a research specialist in the Neural Plasticity Research Lab, she led a project on the premotor cortex’s role in implicit sequence-specific learning, using a serial reaction time task (SRTT), transcranial magnetic stimulation (TMS), and EMG. As a PhD student, she has been named a Centennial Scholar and is supported by Emory’s T32 Neuroscience Training Program.\n\nIran has served as Co-President and Secretary of Graduates in Neuroscience and as Communications Committee Chair for the Atlanta Brain Bee Competition.\n\nOutside the lab, Iran loves spending time with friends, reading fantasy books, exercising, visiting farmers markets, and playing with and cuddling her dachshund Butters, who means the world to her."
