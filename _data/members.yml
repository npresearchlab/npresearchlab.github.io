    "bio": "Oindrila Sinha, PhD, is a postdoctoral fellow at the Georgia Institute of Technology and Emory School of Medicine. She studies how perceptual learning becomes motor skill, how this changes across adulthood, and why people respond differently to the same practice. Her current projects combine eye tracking, EEG, motor-behavior measures, and machine learning. One shows that anticipatory gaze reveals who is learning a movement sequence before their performance improves. Another uses embedded sensors to measure how people use upper-limb prostheses in daily life. A third asks how aging changes the way vision prepares the body for balance.\n\nOindrila's path to research began in the life sciences at Presidency University, India. There, she built biomedical devices, including a patented EEG-based drowsy-driver detector and a navigation aid for people with visual impairments. That work led her to a PhD in Motor Control at Penn State, with a minor in Statistics.\n\nOutside the lab, she loves working out, spending time in nature, and cooking for friends and family."
