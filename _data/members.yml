  honors: Petit Lanier Undergraduate Research Scholarship
  photo: /assets/img/people/joon-han-kim.jpg
  links:
  - label: Email
    url: mailto:joon.kim@emory.edu
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=CpI_AuUAAAAJ&hl=en
  bio: >-
    Joon's research focuses on understanding how brain disorders increase fall risk and impair balance
    by examining changes in the brain and body movement. He aims to translate these findings into
    strategies and assistive devices that better detect fall risk and prevent falls. His current
    projects investigate the mechanisms underlying balance impairment in Parkinson's disease and explore
    robotic exoskeletons as potential tools to reduce fall risk.
