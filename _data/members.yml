    "bio": "Yasmine Bassil, PhD, is an Assistant Research Scientist in the Neural Plasticity Research Lab, where she studies how the brain helps us find our way, and how that ability changes with age. She uses brain imaging (fMRI) to map the human spatial navigation network and link changes in it to navigation ability later in life, and pairs imaging with brain stimulation (concurrent TMS-fMRI) to map navigational circuits.\n\nYasmine earned her PhD in Neuroscience at Emory University, completing her dissertation in this lab as an NSF Graduate Research Fellow and a Scholar in the Georgia Tech/Emory T32 Computational Neural Engineering Training Program. She earned her bachelor’s in Neuroscience at Georgia Tech, where she completed the Research Option and used fMRI to study whole-brain dynamics in ADHD in Dr. Shella Keilholz’s MIND Lab.\n\nIn graduate school, she co-chaired the Neuroscience Graduate Program’s Diversity, Equity, and Inclusion Committee, served as Co-President of Graduates in Neuroscience, and was Internal Affairs Chair of the international non-profit Arabs in Neuroscience.\n\nOutside the lab, you might find her at local concerts, thrifting, wandering a museum, or singing karaoke. At home, she tends houseplants, cooks cuisines from around the world, and plays music (piano, learning bass guitar)."
