    "bio": "Nathan Baune, PhD, is Lead Research Biomedical Engineer in the Neural Plasticity Research Lab and the Neuromechanics Lab at Emory University. He studies how the brain estimates and controls the state of the body, and builds the instruments and software that make those questions testable in patients. His current work combines EEG, EMG, and robotic perturbations to study movement in Parkinson's disease, including the brain–body dynamics behind freezing. He designed PRE-Sync, a synchronization device now used by labs across institutions, co-invented POISE, a portable balance-perturbation device, and built the open-source tools Epoche and MR.Flow, in use across several Emory labs.\n\nNathan came to research through psychology at the University of Oregon. He earned his PhD in Rehabilitation Science at Washington University School of Medicine, using fMRI and virtual reality to study how people control movement when they cannot see their own body, and co-founded a start-up that used smartwatches to track daily activities in stroke survivors. He joined Emory as a postdoctoral fellow in 2021, supported by fellowships from the American Heart Association and the American Parkinson Disease Association.\n\nOutside the lab, he plays music, cooks, and builds elaborate Halloween costumes."
