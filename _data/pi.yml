# The principal investigator, shown at the top of the People page.
name: Michael R. Borich, DPT, PhD
role: Principal Investigator
photo: /assets/img/people/michael-borich.jpg
summary: >-
  Dr. Borich is keenly interested in understanding and harnessing the plastic capacity of the human
  nervous system in health and disease in an effort to improve rehabilitation outcomes for individuals
  with neurologic injury and disease. His research utilizes multimodal neuroimaging and neurostimulation
  techniques to characterize the brain structural and functional correlates of neural plasticity
  associated with learning and experience.
