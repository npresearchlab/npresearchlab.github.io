title: Neural Plasticity Research Lab
short_title: NPRL
description: >-
  The Neural Plasticity Research Lab (NPRL) at Emory University studies how the human brain adapts,
  to design new rehabilitation strategies for people with neurologic injury and disease.
url: https://npresearchlab.github.io
baseurl: ""

# Contact details used across the site (header, footer, Get involved page)
contact:
  email: nprl.emory@gmail.com
  phone: 404-712-4000
  address_lines:
    - Emory Rehabilitation Hospital
    - 1441 Clifton Road NE
    - Atlanta, GA 30322
  pi: Michael R. Borich, DPT, PhD

social:
  - label: X (Twitter)
    url: https://twitter.com/NPResearchLab
  - label: GitHub
    url: https://github.com/npresearchlab

# Top navigation, in order
nav:
  - title: About
    url: /about/
  - title: People
    url: /people/
  - title: Research
    url: /research/
  - title: Gallery
    url: /gallery/
  - title: Get involved
    url: /get-involved/

plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - CLAUDE.md
  - DESIGN.md
  - EDITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
